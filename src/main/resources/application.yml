server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: tomcat
  servlet:
    context-path: /
  # HTTPS (uncomment + generate keystore):
  # ssl:
  #   enabled: true
  #   key-store: classpath:keystore.p12
  #   key-store-password: changeit
  #   key-store-type: PKCS12
  #   key-alias: tomcat
  # port: 8443

spring:
  thymeleaf:
    cache: false
  # security.user removed - using SecurityConfig InMemoryUserDetailsManager
  h2:
    console:
      enabled: false
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

logging:
  level:
    com.secureshield: DEBUG
    org.springframework.security: DEBUG

app:
  phishing:
    blacklist:
      enabled: true
    heuristics:
      max-url-length: 100
      suspicious-tlds: [tk, ml, ga, cf, gq, xyz, top]

