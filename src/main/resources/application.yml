server:
  port: 8080
  servlet:
    context-path: /

spring:
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
  # security.user removed - using SecurityConfig InMemoryUserDetailsManager
  h2:
    console:
      enabled: false
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    com.secureshield: DEBUG
    org.springframework.security: DEBUG

app:
  phishing:
    blacklist:
      enabled: true
    heuristics:
      max-url-length: 100
      suspicious-tlds: [tk, ml, ga, cf, gq, xyz, top]

