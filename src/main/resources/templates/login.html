<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecureShield — IDS/IPS Console</title>
<!-- Login fonts -->
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link th:href="@{/css/dashboard.css}" rel="stylesheet">
</head>
<body>

<!-- ═══════════════════════════════════════════════════
     SCREEN 1 — LOGIN (COMPLETE FROM TASK HTML)
     ═══════════════════════════════════════════════════ -->
<div id="screen-login">

  <!-- Background orbs -->
  <div class="l-orb l-orb-1"></div>
  <div class="l-orb l-orb-2"></div>

  <!-- Toast -->
  <div id="l-toast">
    <div class="l-toast-dot" id="l-toast-dot"></div>
    <span id="l-toast-msg"></span>
  </div>

  <!-- Card wrapper -->
  <div class="l-page">
    <div class="l-card">

      <!-- Brand -->
      <div class="l-brand">
        <div class="l-brand-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V7L12 2zm0 2.18L19 8.3V12c0 4.16-2.84 8.11-7 9.19C7.84 20.11 5 16.16 5 12V8.3L12 4.18z"/></svg>
        </div>
        <div>
          <div class="l-brand-name">SecureShield</div>
          <div class="l-brand-tag">IDS · IPS · WAF Console</div>
        </div>
      </div>

      <!-- Heading -->
      <div class="l-heading">
        <div th:if="${param.error}" style="background:#ef4444;color:white;padding:12px;border-radius:8px;margin:0 0 16px 0;font-size:14px;font-weight:500;box-shadow:0 2px 8px rgba(239,68,68,0.3);">
          ❌ Login failed - Invalid credentials
          <br><small>✓ Email: <code>admin@secureshield.io</code> | Password: <code>admin123</code></small>
        </div>
        <h1>Welcome back</h1>
        <p>Sign in to your security console to continue</p>
      </div>

      <!-- Spring Security Form (Enhanced) -->
      <form th:action="@{/login}" method="post" id="l-login-form" novalidate autocomplete="off" onsubmit="handleSubmit(event)">

        <!-- Email -->
        <div class="l-field" id="l-field-email">
          <label for="l-email">Email address</label>
          <div class="l-input-wrap">
            <span class="l-input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/>
              </svg>
            </span>
            <input type="email" id="l-email" name="username" placeholder="you@company.com" autocomplete="email" oninput="lClearField('l-field-email')" required>
          </div>
          <div class="l-field-msg" id="l-msg-email"></div>
        </div>

        <!-- Password -->
        <div class="l-field" id="l-field-password">
          <label for="l-password">Password</label>
          <div class="l-input-wrap">
            <span class="l-input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="l-password" name="password" placeholder="Enter your password" autocomplete="current-password" oninput="lClearField('l-field-password')" required>
            <button type="button" class="l-eye-btn" id="l-eye-btn" onclick="lTogglePassword()" aria-label="Toggle password">
              <svg id="l-eye-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="l-eye-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <div class="l-field-msg" id="l-msg-password"></div>
        </div>

        <!-- Remember + Forgot -->
        <div class="l-row-options">
          <label class="l-remember">
            <input type="checkbox" id="l-remember" name="_spring_security_remember_me">
            <div class="l-checkbox-box">
              <svg viewBox="0 0 10 8"><polyline points="1,4 4,7 9,1" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            Remember me
          </label>
          <a href="#" class="l-forgot" onclick="handleForgot(event)">Forgot password?</a>
        </div>

        <!-- Submit -->
        <button type="submit" class="l-btn-submit" id="l-btn-submit">
          <span class="l-btn-text">Sign In</span>
          <span class="l-btn-spinner"><span class="l-spinner-ring"></span></span>
        </button>

        <!-- CSRF (Spring Security) -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      </form>

      <!-- SSO -->
      <div class="l-divider">or continue with</div>
      <div class="l-sso-row">
        <a href="#" class="l-btn-sso" onclick="ssoLogin(event,'LDAP')">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
          </svg>
          LDAP / AD
        </a>
        <a href="#" class="l-btn-sso" onclick="ssoLogin(event,'SAML')">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 4l6 2.67V11c0 3.69-2.56 7.15-6 8.21-3.44-1.06-6-4.52-6-8.21V7.67L12 5z"/>
          </svg>
          SSO / SAML
        </a>
      </div>

    </div><!-- /.l-card -->

    <!-- Footer -->
      <div class="l-card-footer">
      </div>

    <!-- Security note -->
    <div class="l-security-note">
      <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      256-bit TLS encrypted · Zero-trust access
    </div>

  </div><!-- /.l-page -->
</div><!-- /#screen-login -->

<!-- LOGIN JAVASCRIPT (will extract to dashboard.js in Step 4) -->
<script>
let lPwVisible = false;

/* ALL LOGIN FUNCTIONS FROM TASK HTML */
function lTogglePassword() {
  lPwVisible = !lPwVisible;
  document.getElementById('l-password').type = lPwVisible ? 'text' : 'password';
  document.getElementById('l-eye-show').style.display = lPwVisible ? 'none' : 'block';
  document.getElementById('l-eye-hide').style.display = lPwVisible ? 'block' : 'none';
}

function lSetFieldError(id, msg) {
  const field = document.getElementById(id);
  const msgEl = document.getElementById(id.replace('l-field-', 'l-msg-'));
  field.classList.remove('success');
  field.classList.add('error');
  if (msgEl) msgEl.textContent = '✕ ' + msg;
}

function lSetFieldSuccess(id) {
  const field = document.getElementById(id);
  field.classList.remove('error');
  field.classList.add('success');
  const msgEl = document.getElementById(id.replace('l-field-', 'l-msg-'));
  if (msgEl) msgEl.textContent = '';
}

function lClearField(id) {
  const field = document.getElementById(id);
  field.classList.remove('error', 'success');
  const msgEl = document.getElementById(id.replace('l-field-', 'l-msg-'));
  if (msgEl) msgEl.textContent = '';
}

let lToastTimer;
function lShowToast(msg, type = 'info') {
  const toast = document.getElementById('l-toast');
  const dot   = document.getElementById('l-toast-dot');
  const text  = document.getElementById('l-toast-msg');
  const colors = { success: '#22c55e', error: '#ef4444', info: '#4f8ef7', warn: '#f59e0b' };
  dot.style.background  = colors[type] || colors.info;
  text.textContent = msg;
  toast.classList.add('show');
  clearTimeout(lToastTimer);
  lToastTimer = setTimeout(() => toast.classList.remove('show'), 3200);
}

function lValidateEmail(val) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val.trim());
}

function handleSubmit(e) {
  e.preventDefault();
  const email    = document.getElementById('l-email').value.trim();
  const password = document.getElementById('l-password').value;
  let valid = true;

  if (!email) {
    lSetFieldError('l-field-email', 'Email address is required');
    valid = false;
  } else if (!lValidateEmail(email)) {
    lSetFieldError('l-field-email', 'Enter a valid email address');
    valid = false;
  } else {
    lSetFieldSuccess('l-field-email');
  }

  if (!password) {
    lSetFieldError('l-field-password', 'Password is required');
    valid = false;
  } else if (password.length < 6) {
    lSetFieldError('l-field-password', 'Password must be at least 6 characters');
    valid = false;
  } else {
    lSetFieldSuccess('l-field-password');
  }

  if (!valid) return;

  // Submit Spring Security form AFTER client validation
  const formData = new FormData(e.target);
  const btn = document.getElementById('l-btn-submit');
  btn.classList.add('loading');
  btn.disabled = true;

  // Real Spring Security POST - no JS demo
  lShowToast('Authenticating...', 'info');
  e.target.submit();

}

function handleForgot(e) {
  e.preventDefault();
  lShowToast('Password reset email sent!', 'info');
}

function ssoLogin(e, provider) {
  e.preventDefault();
  lShowToast(`Redirecting to ${provider}...`, 'info');
}

// Auto-focus
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('l-email')?.focus();
});
</script>

</body>
</html>
