<div th:fragment="loginFormFallback">
  <!-- FALLBACK simple form (main login.html uses full version) -->
  <div id="screen-login" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#080b12;padding:20px">
    <div class="l-page">
      <div class="l-card" style="max-width:420px">
        <div class="l-brand">
          <div class="l-brand-icon">
            <svg viewBox="0 0 24 24" style="width:38px;height:38px;fill:white"><path d="M12 2L3 7v5c0 5.25 3.75 10.15 9 11.25C17.25 22.15 21 17.25 21 12V7L12 2z"/></svg>
          </div>
          <div>
            <div class="l-brand-name">SecureShield</div>
            <div class="l-brand-tag">Fallback Login</div>
          </div>
        </div>
        <form th:action="@{/login}" method="post" style="margin-top:24px">
          <div class="l-field" style="margin-bottom:16px">
            <label style="display:block;font-size:12px;color:#6b748a;margin-bottom:6px">Email</label>
            <input type="email" name="username" placeholder="admin@secureshield.io" required style="width:100%;padding:12px;border:1px solid rgba(255,255,255,0.1);border-radius:8px;background:#131926;color:white;font-size:14px">
          </div>
          <div class="l-field" style="margin-bottom:20px">
            <label style="display:block;font-size:12px;color:#6b748a;margin-bottom:6px">Password</label>
            <input type="password" name="password" placeholder="admin123" required style="width:100%;padding:12px;border:1px solid rgba(255,255,255,0.1);border-radius:8px;background:#131926;color:white;font-size:14px">
          </div>
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" style="width:100%;padding:14px;background:#4f8ef7;color:white;border:none;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer">Sign In</button>
        </form>
        <div style="margin-top:20px;text-align:center;font-size:12px;color:#6b748a">
        </div>
      </div>
    </div>
  </div>
</div>
